<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thanks for visiting</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: system-ui, sans-serif;
      color: #202124;
      background: #f4f6f8;
    }
    main {
      width: min(100%, 520px);
      padding: 40px 28px;
      text-align: center;
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 30px #15253614;
    }
    h1 { margin: 0 0 12px; font-size: clamp(28px, 6vw, 40px); }
    p { margin: 0; color: #5f6368; line-height: 1.6; }
  </style>
</head>
<body>
  <main>
    <h1>Thanks for visiting my page!</h1>
    <p>We appreciate your visit. Have a great day.</p>
  </main>
</body>
</html>
